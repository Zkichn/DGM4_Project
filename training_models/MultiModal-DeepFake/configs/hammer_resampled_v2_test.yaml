train_file: ["hammer_resampled_v2/metadata/train.json"]
val_file: ["hammer_resampled_v2/metadata/test.json"]
data_root: "/root/autodl-tmp/datasets"
bert_config: 'configs/config_bert.json'
deit_checkpoint: "local_models/vit-weight/checkpoints/checkpoints/deit_base_patch16_224-b5f2ef4d.pth"

image_res: 256
vision_width: 768
embed_dim: 256
batch_size_train: 4
batch_size_val: 128
temp: 0.07
queue_size: 65536
momentum: 0.995
alpha: 0.4
max_words: 50
label_smoothing: 0.0

loss_MAC_wgt: 0.1
loss_BIC_wgt: 1
loss_bbox_wgt: 0.1
loss_giou_wgt: 0.1
loss_TMG_wgt: 1
loss_MLC_wgt: 1

optimizer: {opt: adamW, lr: 1e-5, lr_img: 5e-5, weight_decay: 0.02}
schedular: {sched: cosine, lr: 1e-5, epochs: 50, min_lr: 5e-7, decay_rate: 1, warmup_lr: 1e-6, warmup_epochs: 2, cooldown_epochs: 0}
