### model
model_name_or_path: /root/autodl-tmp/DGM4_Project/training_models/base_models/Qwen3-VL-8B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
gradient_checkpointing: true
adapter_name_or_path: ../../outputs/qwen3-vl-8b/dgm4-curriculum/stage2-grounding-v2-chain/checkpoint-6500
use_dgm4_field_weighted_loss: true
dgm4_format_weight: 0.5
dgm4_verdict_weight: 1.0
dgm4_atomic_weight: 2.0
dgm4_category_weight: 1.5
dgm4_box_weight: 1.5
dgm4_text_pos_weight: 2.5

### dataset
dataset_dir: ../../datasets/dgm4_stage2_grounding_v2
media_dir: /root/autodl-tmp/datasets
dataset: dgm4_stage2_grounding_v2_train
eval_dataset: dgm4_stage2_grounding_v2_val
template: qwen3_vl_nothink
default_system: "You are a multimodal forensic grounding assistant. Determine authenticity, atomic labels FS/FA/TS/TA, final category, and requested grounding fields. Mark only minimal manipulated text token positions and do not include unchanged surrounding words. Respond only with the requested fields."
cutoff_len: 2048
preprocessing_num_workers: 1
dataloader_num_workers: 8

### output
output_dir: ../../outputs/qwen3-vl-8b/dgm4-curriculum/stage2-grounding-v2-chain-wloss-0p3ep
logging_dir: ../../logs/qwen3-vl-8b-dgm4-curriculum-stage2-grounding-v2-chain-wloss-0p3ep
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 3
learning_rate: 1.0e-5
num_train_epochs: 0.3
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 500
