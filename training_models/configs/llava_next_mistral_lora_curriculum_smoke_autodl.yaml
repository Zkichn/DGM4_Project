### model
model_name_or_path: /root/autodl-tmp/DGM4_Project/training_models/base_models/llava-v1.6-mistral-7b-hf
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
gradient_checkpointing: true

### dataset
dataset_dir: ../../datasets/dgm4_stage1_cls
media_dir: /root/autodl-tmp/datasets
dataset: dgm4_stage1_cls_val
template: llava_next_mistral
default_system: "You are a multimodal forensic classifier."
cutoff_len: 4096
preprocessing_num_workers: 1
dataloader_num_workers: 2

### output
output_dir: ../../outputs/_smoke_llava_next_mistral
logging_dir: ../../logs/_smoke_llava_next_mistral
logging_steps: 1
save_steps: 2
save_total_limit: 1
plot_loss: false
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
max_steps: 2
lr_scheduler_type: constant
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
